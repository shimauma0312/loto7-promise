# nginx設定ファイル - ロト7予想API用
# /etc/nginx/sites-available/loto7-api に配置して使用

upstream loto7_api {
    # APIサーバーのアップストリーム設定
    # 複数のAPIサーバーインスタンスを負荷分散する場合はここに追加
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    # 例: server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
    
    # キープアライブ接続数の設定（パフォーマンス向上）
    keepalive 32;
}

server {
    listen 80;
    # 本番環境では適切なドメイン名に変更してください
    server_name loto7-api.example.com;
    
    # セキュリティヘッダーの設定
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    
    # アクセスログとエラーログの設定
    access_log /var/log/nginx/loto7-api.access.log;
    error_log /var/log/nginx/loto7-api.error.log;
    
    # リクエストサイズの制限（APIなので小さめに設定）
    client_max_body_size 1M;
    
    # タイムアウトの設定
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # メインのAPI locations
    location /api/ {
        # APIサーバーへのプロキシ設定
        proxy_pass http://loto7_api;
        
        # 必要なヘッダーの転送
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # レスポンスバッファリングの設定
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # キープアライブの有効化
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # エラーページの設定
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }
    
    # ヘルスチェック用エンドポイント
    location /health {
        proxy_pass http://loto7_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ヘルスチェックは高速レスポンスが必要
        proxy_connect_timeout 2s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
    }
    
    # API仕様書やドキュメント用（静的ファイル）
    location /docs/ {
        # 静的ファイルがある場合のサンプル設定
        # root /var/www/loto7-api-docs;
        # index index.html;
        
        # 現在は簡単なリダイレクト
        return 301 /api/v1/info;
    }
    
    # エラーページ
    location = /50x.html {
        root /var/www/html;
        internal;
    }
    
    # ファビコンとロボット.txtの設定（404を避けるため）
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }
    
    location = /robots.txt {
        log_not_found off;
        access_log off;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    
    # その他のリクエストはAPI情報にリダイレクト
    location / {
        return 301 /api/v1/info;
    }
}

