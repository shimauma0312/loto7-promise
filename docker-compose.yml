services:
  #   docker-compose up -d --build
  #   docker-compose exec dev sh
  #   その後コンテナ内で: go run ./cmd/result など
  dev:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - .:/app
      - go-cache:/go/pkg/mod
    environment:
      - CGO_ENABLED=0
    container_name: loto7-dev
    command: ["tail", "-f", "/dev/null"]
    stdin_open: true
    tty: true

volumes:
  go-cache: